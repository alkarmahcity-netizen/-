<title>النظام المالي لديوان الأنبار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* تخطيط: شريط علوي كحلي ثابت + تبويبات، محتوى بعرض 1240px، درج جانبي للبطاقات والنماذج */
:root{
  --bg:#f2f4f7;--surface:#ffffff;--surface2:#f7f8fa;--ink:#14213a;--muted:#5b6578;--line:#dde2ea;
  --navy:#1d3557;--accent:#1d3557;--gold:#a57f35;--head:#1d3557;--head-ink:#ffffff;--head-muted:#c9d3e3;
  --ok:#2e7d4f;--warn:#a86a12;--bad:#b42318;--info:#2563a8;--idle:#6f7a8b;
  --f-ui:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;--f-head:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1520;--surface:#162030;--surface2:#1b273a;--ink:#e5eaf2;--muted:#9aa6b8;--line:#28354b;
  --navy:#9dbbe6;--accent:#9dbbe6;--gold:#d4b06a;--head:#111b2a;--head-ink:#f1f4f9;--head-muted:#93a2b8;
  --ok:#5cc28a;--warn:#e0a84a;--bad:#f07167;--info:#6aa6e8;--idle:#8b95a5;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520;--surface:#162030;--surface2:#1b273a;--ink:#e5eaf2;--muted:#9aa6b8;--line:#28354b;
  --navy:#9dbbe6;--accent:#9dbbe6;--gold:#d4b06a;--head:#111b2a;--head-ink:#f1f4f9;--head-muted:#93a2b8;
  --ok:#5cc28a;--warn:#e0a84a;--bad:#f07167;--info:#6aa6e8;--idle:#8b95a5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{overflow-x:clip}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.topbar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.seal{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;color:var(--gold);flex:none}
.brand{min-width:0;flex:1}
.brand h1{font-size:17px;line-height:1.3}
.brand p{margin:0;font-size:12.5px;color:var(--head-muted)}
.sync{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.25);color:var(--head-muted);white-space:nowrap}
.sync.on{color:#bfe8cf;border-color:rgba(130,210,160,.5)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--head-muted);text-decoration:none;padding:9px 13px 10px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--gold);font-weight:700}
nav.tabs a .cnt{font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;margin-inline-start:4px}
nav.tabs a .cnt.g{background:var(--gold)}
nav.tabs a .cnt:empty{display:none}
.grps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.grp{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--head-muted);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.grp[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}

main{padding-block:18px 60px}
.view{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vhead h2{font-size:18px}
.srcbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.srcbar>*{max-width:100%}
.srcbar span{font-size:13px;color:var(--muted);margin-inline-end:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpis.k7{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;text-align:start}
button.kpi{cursor:pointer;font:inherit;color:inherit}
button.kpi[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-head);font-size:23px;font-weight:700;color:var(--accent)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--f-ui);font-weight:400;font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{min-width:0}
.bar .t{display:flex;justify-content:space-between;gap:2px 10px;font-size:13.5px;flex-wrap:wrap}
.bar .t b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t span{color:var(--muted);font-size:12.5px}
.track{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px;position:relative}
.track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--navy);border-radius:99px}
.track i.c{background:color-mix(in srgb,var(--gold) 45%,transparent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}

.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:500;border:1px solid}
.s-done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.s-part{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);border-style:dashed;background:transparent}
.s-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.s-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.s-info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.s-gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.s-idle{color:var(--idle);border-color:color-mix(in srgb,var(--idle) 40%,transparent);background:color-mix(in srgb,var(--idle) 8%,transparent)}

.stlist{display:grid;gap:8px}
.strow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px;cursor:pointer;padding:4px 6px;border-radius:6px;background:none;border:0;text-align:start;width:100%}
.strow:hover{background:var(--surface2)}
.strow .n{color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters>*{flex:1 1 150px;min-width:0}
.filters input[type=search]{flex:1 1 100%}
@media (min-width:900px){.filters input[type=search]{flex-basis:300px}}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%;width:100%}
.btn{background:var(--navy);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{font-size:13.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.summary b{color:var(--ink);font-weight:700}
.activef{display:flex;gap:6px;flex-wrap:wrap}
.activef button{font-size:12.5px;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:99px;padding:3px 10px;cursor:pointer}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--surface2);font-weight:700;font-size:12.5px;color:var(--muted);z-index:1;white-space:nowrap}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:var(--surface2)}
td.n,th.n{text-align:left;white-space:nowrap}
td.t{color:var(--muted);width:44px}
.pname{font-weight:500}
.pco{color:var(--muted);font-size:12.5px}
.mini{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.mini .track{width:60px;margin:0;height:7px}
.flag{color:var(--bad);font-size:12px;font-weight:700}
.more{display:flex;justify-content:center;padding:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.iact{display:grid;gap:6px;min-width:220px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px}
.iact .warnx{font-size:12px;color:var(--warn)}

@media (max-width:720px){
  .tbl-wrap.cards{max-height:none;border:0;background:none;overflow:visible}
  .cards table,.cards tbody{display:block}
  .cards thead{display:none}
  .cards tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
  .cards td{border:0;padding:0;min-width:0;overflow-wrap:anywhere}
  .cards td.t{display:none}
  .cards td.wide{grid-column:1/-1}
  .cards td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--muted)}
  .cards td.n{text-align:right}
  .cards .mini{justify-content:flex-start}
  .iact{min-width:0}
}

.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.al{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px}
.al.bad{border-inline-start-color:var(--bad)}
.al.info{border-inline-start-color:var(--info)}
.al.gold{border-inline-start-color:var(--gold)}
.al h3{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.al h3 .num{font-size:20px}
.al p{margin:0;font-size:13px;color:var(--muted)}
.al .btn{justify-self:start}

.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40}
aside.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(760px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:0 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:var(--head);color:var(--head-ink);padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start;z-index:2}
.dhead h2{font-size:16px;line-height:1.5;flex:1;min-width:0}
.dhead p{margin:4px 0 0;font-size:12.5px;color:var(--head-muted);font-family:var(--f-ui);font-weight:400}
.x{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--head-ink);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none;font-size:18px}
.dbody{padding:16px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fig .l{font-size:12px;color:var(--muted)}
.fig .v{font-weight:700;font-size:15px}
.fig.hl .v{color:var(--accent)}
.alist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.alist li{font-size:13px;padding:7px 10px;border-radius:6px;background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad)}
.alist li.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn)}
.alist li.info,.alist li.gold{background:color-mix(in srgb,var(--info) 9%,transparent);color:var(--info)}
form.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
form.fm label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);align-content:start}
form.fm label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
form.fm .full{grid-column:1/-1}
form.fm .pv{font-size:11.5px;color:var(--accent);min-height:1em}
.fmsg{font-size:12.5px;color:var(--muted)}
.fmsg.err{color:var(--bad);font-weight:500}
.netbox{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.netbox b{font-size:16px;color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.ylist{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;overflow-x:auto}
.ycol{flex:1 0 42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.ycol i{width:70%;background:var(--navy);border-radius:4px 4px 0 0;min-height:1px}
.ycol span{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.ycol b{font-size:10.5px;font-weight:500}
details.card summary{cursor:pointer;font-weight:700;font-family:var(--f-head);font-size:15px}
details.card[open] summary{margin-bottom:12px}
.rawt td:first-child{color:var(--muted);width:45%}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.pick{display:grid;gap:6px;margin-top:8px}
.pick button{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.pick button:hover{border-color:var(--gold)}
.steps{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.steps .on{color:var(--ink);font-weight:700}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.rep .card{display:grid;gap:8px;align-content:start}
.rep .card h3{font-size:15px}
.rep .card p{margin:0;font-size:13px;color:var(--muted)}
.rep .card .btn{justify-self:start}
.chg{font-size:12px;color:var(--muted)}
.chg b{color:var(--ink);font-weight:500}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.enf h2 .btn{margin-inline-start:auto}
.lockb{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.lockb.on{background:var(--gold);color:#fff}
#lockbox{display:flex;gap:6px;flex-wrap:wrap}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-block:10px}
@media (prefers-reduced-motion:no-preference){aside.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.6}}}
</style>

const coKey=s=>norm(String(s||"").split("/")[0].replace(/^شركة\s+/,""));

function baseAdvCount(p){
  if(p.id[0]==="X")return (p.raw||[]).filter(([h,v])=>/^السلفة /.test(h)&&typeof v==="number"&&v>0).length;
  if(p.id[0]==="M"){const r=(p.raw||[]).find(x=>x[0]==="رقم السلفة");return r&&typeof r[1]==="number"?r[1]:0}
  return 0}

function recompute(){
  const np=NP.map(d=>({id:d._id,src:d.src||SRC_MAIN,st:d.st||"غير محددة",pl:d.pl||"غير محددة",nm:d.nm||"مشروع بلا اسم",co:d.co||"—",
    c0:+d.c0||0,c:+d.c||+d.c0||0,ap:+d.ap||0,sp:0,adv:0,bank:0,fin:0,cno:d.cno||null,cdt:d.cdt||null,sdt:d.sdt||null,dur:+d.dur||0,ext:0,yrs:[],raw:[],isNew:true,overAlloc:!!d.overAlloc,at:d.at,by:d.by}));
  const all=[...BASE,...np];
  const txBy=group(TX,"pid"),advBy=group(ADV,"pid"),guBy=group(GU,"pid"),loBy=group(LO,"pid");
  E=all.map(p=>{const e={...p};e.tx=txBy[p.id]||[];
    e.advs=(advBy[p.id]||[]).slice().sort((a,b)=>((a.final?999:a.no)-(b.final?999:b.no))||String(a.at).localeCompare(String(b.at)));
    const pv=[];for(const a of e.advs)if(a.stage!=="rejected")for(const q of payList(a))pv.push({at:q.at||a.at||"",p:q});
    const ev=[...e.tx.map(t=>({at:t.at||"",t})),...pv].sort((x,y)=>x.at.localeCompare(y.at));
    e.paidYear=0;e.paidYearAdv=0;
    for(const v of ev){
      if(v.p){const g=+v.p.amt||0;e.sp+=g;if(String(v.p.date||v.at).startsWith(CUR_YEAR)){e.paidYear+=g;e.paidYearAdv+=g}}
      else{const t=v.t,a=+t.amt||0;
        if(t.type==="pay"){e.sp+=a;if(String(t.date||"").startsWith(CUR_YEAR))e.paidYear+=a}
        else if(t.type==="change")e.c+=a;
        else if(t.type==="status"&&t.newSt)e.st=t.newSt;
        else if(t.type==="edit"&&t.changes)for(const [f,ch] of Object.entries(t.changes))if(EDITABLE[f])e[f]=EDITABLE[f].num?(+ch.to||0):(ch.to||"");}}
    e.pendNew=e.advs.reduce((s,a)=>s+remOf(a),0);
    e.readyAmt=e.advs.filter(a=>a.stage==="ready"||a.stage==="partial").reduce((s,a)=>s+remOf(a),0);
    const legG=e.advs.filter(a=>a.legacy&&a.stage!=="rejected").reduce((s,a)=>s+(+a.gross||0),0);
    e.legacyLeft=Math.max(0,(e.adv||0)-legG);
    e.pend=e.legacyLeft+e.pendNew;
    e.loans=(loBy[p.id]||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    e.loanOut=e.loans.filter(l=>l.st==="active").reduce((s,l)=>s+Math.max(0,(+l.amt||0)-(+l.repaid||0)),0);
    e.bankBase=e.bank||0;e.bank=e.bankBase+e.loanOut;
    e.baseAdvN=baseAdvCount(p);
    e.rate=e.c>0?e.sp/e.c:null;
    e.gs=(guBy[p.id]||[]).slice().sort((a,b)=>String(a.exp).localeCompare(String(b.exp)));
    e.al=RULES.filter(r=>r.f(e)).map(r=>r.id);
    e.k=norm(e.nm+" "+e.co+" "+(e.cno||""));e.ck=coKey(e.co);return e});
  EM=Object.fromEntries(E.map(e=>[e.id,e]));

}

function emptyAgg(pl,yr){return {pl,yr,base:0,add:0,cut:0,tr:0,alloc:0,com:0,spent:0,avail:0,items:[],moves:[]}}
function allocAgg(){const A={};const k=(pl,yr)=>{const key=pl+"|"+yr;return A[key]=A[key]||emptyAgg(pl,yr)};
  for(const a of AL){const r=k(a.pl,a.yr);const v=+a.amt||0;r.alloc+=v;r.moves.push(a);if(a.kind==="base")r.base+=v;else if(a.kind==="add")r.add+=v;else if(a.kind==="cut")r.cut+=v;else r.tr+=v}
  for(const p of NP){const e=EM[p._id];if(!e)continue;const yr=yearOf(p.cdt)||yearOf(p.at);const r=k(e.pl,yr);r.com+=+p.c0||0;r.items.push({pid:e.id,kind:"عقد جديد",amt:+p.c0||0,date:p.cdt||String(p.at).slice(0,10)})}
  for(const t of TX){const e=EM[t.pid];if(!e)continue;let amt=0,kind="";
    if(t.type==="change"){amt=+t.amt||0;kind="أمر غيار"}else if(t.type==="edit"&&t.changes&&t.changes.c){amt=(+t.changes.c.to||0)-(+t.changes.c.from||0);kind="تعديل مبلغ العقد"}
    if(!amt)continue;const r=k(e.pl,yearOf(t.date)||yearOf(t.at));r.com+=amt;r.items.push({pid:e.id,kind,amt,date:t.date})}
  for(const e of E){const add=(y,v)=>{const r=A[e.pl+"|"+y];if(r&&v)r.spent+=v};
    for(const a of e.advs)if(a.stage!=="rejected")for(const q of payList(a))add(yearOf(q.date||q.at),+q.amt||0);
    for(const t of e.tx)if(t.type==="pay")add(yearOf(t.date),+t.amt||0);
    const cy=(e.yrs||[]).find(y=>y[0]==="السنة الحالية");if(cy)add(CUR_YEAR,cy[1])}
  for(const r of Object.values(A))r.avail=r.alloc-r.com;return A}
function allocCheck(pl,yr,amt){if(!(amt>0))return null;const r=ALLOC[pl+"|"+yr];
  if(r&&r.moves.length&&amt<=r.avail)return null;

async function saveVoucher(ev){ev.preventDefault();const msg=$("#ov_msg");msg.className="fmsg err";
  const date=val("ov_date"),yr=yearOf(date),code=val("ov_line").split(" — ")[0].trim(),l=opLine(yr,code);
  const g=money("ov_gross"),r=money("ov_ret"),t=money("ov_tax"),o=money("ov_oth");
  if(!yr){msg.textContent="أدخل تاريخ الصرف.";return}if(!l){msg.textContent=`البند «${code}» غير موجود في سنة ${yr}.`;return}
  if(!val("ov_payee")){msg.textContent="اكتب الجهة المستفيدة.";return}
  if(!(g>0)){msg.textContent="أدخل المبلغ الإجمالي.";return}if([r,t,o].some(x=>isNaN(x)||x<0)||r+t+o>g){msg.textContent="تحقق من الاستقطاعات.";return}
  const avail=(+l.alloc||0)-opSpent(yr,code);let over=false;
  if(g>avail+1){if(SET.enforce){msg.textContent=`مرفوض: المبلغ يتجاوز المتاح من تخصيص البند (${fmt(avail)} د.ع). أضف تعزيزاً للبند أولاً.`;return}

  const no=Math.max(0,...OPX.filter(v=>String(v.yr)===yr).map(v=>+v.no||0))+1;
  const doc={yr,no,date,code,payee:val("ov_payee"),desc:val("ov_desc"),gross:g,ret:r,tax:t,oth:o,net:g-r-t-o,ref:val("ov_ref"),st:"active",at:new Date().toISOString(),by:await me()};if(over)doc.overAlloc=true;
  $("#ov_save").disabled=true;
  try{await DB.collection("opexp").add(doc);logA("مستند صرف",{label:`م.ص ${no}/${yr} — ${code} ${l.name}`,amt:g,d:`${doc.payee}${doc.desc?" · "+doc.desc:""}${doc.ref?" · صك "+doc.ref:""}${over?" · تجاوز التخصيص":""}`});toast(`حُفظ مستند الصرف رقم ${no}/${yr}`);S.oyr=yr;closeDrawer()}
  catch(err){$("#ov_save").disabled=false;failMsg(msg,err)}}

const IMPORTS={
 emps:{title:"استيراد سجل الموظفين",fields:EMP_F,
  check(rows){const cur=new Map(EMP.map(e=>[String(e.num),e]));const seen=new Set();
   return rows.map(v=>{const m=[];let st="new",diff=[];const k=String(v.num??"").trim();
    if(!k)return {v,st:"err",m:["الرقم الوظيفي فارغ"]};if(!v.name&&!cur.has(k))return {v,st:"err",m:["الاسم فارغ"]};

    const t=hdr.map(()=>"");t[4]="المجموع";[5,6,7].forEach(j=>t[j]=rows.reduce((s,r)=>s+r[j],0));X.utils.book_append_sheet(wb,sheetFrom(X,[hdr,...rows,t],{total:1}),"الموازنة التشغيلية "+(S.oyr||CUR_YEAR));return `الموازنة التشغيلية ${S.oyr||CUR_YEAR}.xlsx`}
  if(kind==="opx"){const hdr=["رقم المستند","السنة","التاريخ","رمز البند","اسم البند","الجهة المستفيدة","البيان","المبلغ الإجمالي","التأمينات","ضريبة الدخل","استقطاعات أخرى","المبلغ الصافي","رقم الصك","الحالة","سبب الإلغاء","المنفذ"];
    const rows=OPX.filter(v=>String(v.yr)===String(S.oyr||CUR_YEAR)).sort((a,b)=>a.no-b.no).map(v=>[v.no,v.yr,v.date,v.code,opLine(v.yr,v.code)?.name||"",v.payee,v.desc||"",+v.gross||0,+v.ret||0,+v.tax||0,+v.oth||0,+v.net||0,v.ref||"",v.st==="cancelled"?"ملغى":"نافذ",v.cancelWhy||"",whoName(v.by)]);
    X.utils.book_append_sheet(wb,sheetFrom(X,[hdr,...rows]),"مستندات الصرف");return `مستندات الصرف ${S.oyr||CUR_YEAR}.xlsx`}
  if(kind==="emps"){const hdr=["ت",...EMP_F.map(f=>f.l),"صافي الراتب"];const rows=EMP.slice().sort((a,b)=>String(a.num).localeCompare(String(b.num),"en",{numeric:true})).map((e,i)=>[i+1,...EMP_F.map(f=>f.t==="num"?+e[f.k]||0:e[f.k]??""),empNet(e)]);
    X.utils.book_append_sheet(wb,sheetFrom(X,[hdr,...rows]),"سجل الموظفين");return `سجل الموظفين ${d}.xlsx`}
  if(kind==="jv"){const A=accMap();const hdr=["رقم القيد","التاريخ","المصدر","المرجع","البيان","رمز الحساب","اسم الحساب","مدين","دائن"];const rows=[];
    for(const x of entries().filter(x=>x.date.startsWith(S.amon||today().slice(0,7))))for(const l of x.lines)rows.push([x.no,x.date,x.src,x.ref,x.desc,A[l.k]?.code||"",A[l.k]?.name||l.k,l.dr||"",l.cr||""]);
    X.utils.book_append_sheet(wb,sheetFrom(X,[hdr,...rows]),"القيود اليومية");return `القيود اليومية ${S.amon||today().slice(0,7)}.xlsx`}
  if(kind==="tb"){const mon=S.amon||today().slice(0,7);const hdr=["رمز الحساب","اسم الحساب","أول المدة مدين","أول المدة دائن","حركة الشهر مدين","حركة الشهر دائن","آخر المدة مدين","آخر المدة دائن"];const sp=v=>[v>0?v:0,v<0?-v:0];
    const rows=tbRows(mon).map(r=>{const o=sp(r.op),c=sp(r.op+r.dr-r.cr);return [r.a.code,r.a.name,o[0],o[1],r.dr,r.cr,c[0],c[1]]});const t=["","المجموع",...[2,3,4,5,6,7].map(j=>rows.reduce((s,r)=>s+r[j],0))];
    X.utils.book_append_sheet(wb,sheetFrom(X,[hdr,...rows,t],{total:1}),"ميزان المراجعة");return `ميزان المراجعة ${mon}.xlsx`}
  if(kind==="ledger"){const a=accList().find(x=>x.k===(S.lacc||"BANK"));const G=ledgerRows(a.k,S.lyr||CUR_YEAR);const hdr=["التاريخ","رقم القيد","المصدر","المرجع","البيان","مدين","دائن","الرصيد"];
    const rows=[["","","","","رصيد أول السنة","","",G.open],...G.rows.map(r=>[r.x.date,r.x.no,r.x.src,r.x.ref,r.x.desc,r.l.dr||"",r.l.cr||"",r.bal])];
    X.utils.book_append_sheet(wb,sheetFrom(X,[hdr,...rows]),"دفتر الأستاذ");return `دفتر الأستاذ ${a.code} ${S.lyr||CUR_YEAR}.xlsx`}
  return null}

/* سجل التدقيق */
function logCls(a){a=String(a||"");return /رفض|مصادرة|فاشلة|تعطيل/.test(a)?"s-bad":/صرف|تسديد/.test(a)?"s-done":/تعديل|تغيير/.test(a)?"s-gold":/فتح|قفل|تصدير/.test(a)?"s-idle":"s-info"}
function auditEntries(){return LOG.map(l=>({at:l.at,pid:l.pid,label:l.label,kind:l.act,cls:logCls(l.act),amt:+l.amt||0,d:l.d,by:l.by})).sort((x,y)=>String(y.at).localeCompare(String(x.at)))}
function vJournal(){
  const L=auditEntries();let body;
  if(DB===false)body=`<div class="empty">قاعدة البيانات المشتركة غير متاحة في هذا العرض. افتح الصفحة من حساب claude.ai مسجَّل.</div>`;
  else if(!L.length)body=`<div class="empty">لم تُسجَّل أي حركة بعد. افتح التعديل بكلمة السر وابدأ العمل، وستظهر كل حركة هنا باسم منفذها ووقتها.</div>`;
  else body=`<div class="tbl-wrap cards"><table><thead><tr><th>ت</th><th>الوقت</th><th>المشروع</th><th>العملية</th><th class="n">المبلغ</th><th>التفاصيل</th><th>المنفذ</th></tr></thead><tbody>
  ${L.slice(0,500).map((t,i)=>`<tr data-id="${esc(t.pid)}"><td class="t num">${i+1}</td><td data-l="الوقت"><span class="num">${esc(String(t.at||"").replace("T"," ").slice(0,16))}</span></td><td class="wide pname">${esc(EM[t.pid]?.nm||t.label||t.pid)}</td>
  <td data-l="العملية"><span class="pill ${t.cls}">${esc(t.kind)}</span></td><td class="n" data-l="المبلغ"><span class="num">${t.amt?fmt(t.amt):"—"}</span></td>
  <td class="wide chg" data-l="التفاصيل">${esc(t.d||"—")}</td><td data-l="المنفذ">${esc(whoName(t.by))}</td></tr>`).join("")}</tbody></table></div>`;
  $("#v-journal").innerHTML=`<div class="vhead"><h2>سجل الحركات</h2>${DL?'<button class="btn ghost" data-xl="audit">تنزيل Excel</button>':""}</div><p class="note">يُسجَّل هنا كل ما يحدث في النظام: الإضافة والتعديل والصرف وفتح التعديل وقفله والمحاولات الفاشلة وتصدير التقارير. كل حركة تُحفظ بتاريخها ومنفذها ولا تُحذف. التصحيح يكون بعملية جديدة (حركة عكسية أو تعديل مع ذكر السبب)، وهذا مبدأ سجل التدقيق في الأنظمة المالية الحكومية.</p>${body}`;
}

/* الدرج */
function openDrawer(d){S.dr=d;S.act=null;S.dirty=false;S.advForm=d.kind==="project"&&d.advForm;S.gForm=d.kind==="project"&&d.gForm;S.gact=null;S.lact=null;S.loanForm=false;renderDrawer(true)}
function closeDrawer(){S.dr=null;S.dirty=false;$("#drawerHost").innerHTML=""}
function shell(title,sub,body){return `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
  <div class="dhead"><h2>${esc(title)}${sub?`<p>${sub}</p>`:""}</h2><button class="x" id="xb" aria-label="إغلاق">✕</button></div><div class="dbody">${body}</div></aside>
  <datalist id="dl-plans">${[...new Set(E.map(e=>e.pl))].sort().map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
  <datalist id="dl-banks">${[...new Set([...BANKS,...GU.map(g=>g.bank).filter(Boolean)])].map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
  <datalist id="dl-st">${[...new Set([...STATUS_BASE,...E.map(e=>e.st)])].map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`}
function renderDrawer(first){
  if(!S.dr){$("#drawerHost").innerHTML="";return}
  const sc=$("aside.drawer")?.scrollTop||0;
  if(S.dr.kind==="project")drProject();else if(S.dr.kind==="newProject")drNewProject();else if(S.dr.kind==="newAdv"||S.dr.kind==="newG")drPickProject();else if(S.dr.kind==="newAlloc")drNewAlloc();else if(S.dr.kind==="alloc")drAlloc();else if(S.dr.kind==="unlock")drUnlock();else if(S.dr.kind==="chpw")drChpw();else if(S.dr.kind==="editAdv")drEditAdv();else if(S.dr.kind==="bulkPay")drBulk();else if(S.dr.kind==="opLine")drOpLine();else if(S.dr.kind==="opVoucher")drOpVoucher();else if(S.dr.kind==="emp")drEmp();else if(S.dr.kind==="import")drImport();else if(S.dr.kind==="jvNew")drJvNew();else if(S.dr.kind==="coa")drCoa();
  $("#xb").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
  const dw=$("aside.drawer");if(first)$("#xb").focus();else dw.scrollTop=sc;
  dw.addEventListener("input",()=>{S.dirty=true});
  bindForms();
}
function moneyField(id,label,val,extra=""){return `<label>${label}<input class="inp num money" id="${id}" type="text" inputmode="numeric" value="${val?fmt(val):""}" ${extra}><span class="pv" data-pv="${id}"></span></label>`}

function drProject(){
  const e=EM[S.dr.id];if(!e){closeDrawer();return}
  const al=RULES.filter(r=>e.al.includes(r.id));const ys=e.yrs||[];const maxY=Math.max(1,...ys.map(y=>y[1]));
  const nextNo=e.baseAdvN+e.advs.filter(a=>a.stage!=="rejected"&&!a.final).length+1;
  const room=e.c-e.sp-e.pendNew;
  $("#drawerHost").innerHTML=shell(e.nm,`${esc(e.co)} · ${esc(e.src)}${e.cno?` · عقد رقم ${esc(e.cno)}`:""}${e.cdt?` في ${esc(e.cdt)}`:""}`,`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${stClass(e.st)}">${esc(e.st)}</span><span class="pill s-idle">${esc(e.pl)}</span>${e.isNew?'<span class="pill s-gold">مشروع مضاف في النظام</span>':""}${e.dur?`<span class="pill s-idle">مدة التنفيذ ${e.dur} يوم${e.ext?` + ${e.ext} مضافة`:""}</span>`:""}</div>
    <div class="figs">
     <div class="fig"><div class="l">مبلغ العقد الأصلي</div><div class="v num">${fmt(e.c0)}</div></div>
     <div class="fig hl"><div class="l">مبلغ العقد بعد التغيير</div><div class="v num">${fmt(e.c)}</div></div>

  const af=$("#advf");if(af)af.onsubmit=saveAdv;

  const emf=$("#emf");if(emf){emf.onsubmit=saveEmp;emf.addEventListener("input",()=>{const n=$("#em_net");if(n)n.textContent=fmt((money("em_base")||0)+(money("em_allow")||0)-(money("em_ded")||0))})}

function netUp(){const g=toNum($("#a_gross")?.value)||0;const d=["a_ret","a_tax","a_fine","a_oth"].reduce((s,i)=>s+(toNum($("#"+i)?.value)||0),0);const n=$("#a_net");if(n)n.textContent=fmt(g-d)}
const val=id=>($("#"+id)?.value||"").trim();
const money=id=>{const v=val(id);if(!v)return 0;const n=toNum(v);return isFinite(n)?Math.round(n):NaN};
async function me(){if(UID)return UID;try{UID=USER?await USER.id():""}catch(_){}return UID}
function failMsg(el,err){el.className="fmsg err";el.textContent=err&&err.code==="not_granted"?"ليست لديك صلاحية الحفظ على هذه الصفحة.":err&&err.code==="quota_exceeded"?"امتلأت سعة قاعدة البيانات لهذا النموذج.":"تعذّر الحفظ. تحقق من الاتصال وأعد المحاولة."}

async function saveAdv(ev){ev.preventDefault();const e=EM[S.dr.id];const msg=$("#a_msg");msg.className="fmsg err";
  const gross=money("a_gross"),ded=["a_ret","a_tax","a_fine","a_oth"].map(money);
  if(!(gross>0)){msg.textContent="أدخل المبلغ الإجمالي للسلفة.";$("#a_gross").focus();return}
  if(ded.some(x=>isNaN(x)||x<0)){msg.textContent="الاستقطاعات يجب أن تكون أرقاماً موجبة.";return}
  if(ded.reduce((a,b)=>a+b,0)>gross){msg.textContent="مجموع الاستقطاعات أكبر من مبلغ السلفة.";return}
  if(!e.c){msg.textContent="لا يوجد مبلغ عقد لهذا المشروع. أدخله أولاً من «تعديل بيانات المشروع».";return}
  if(e.sp+e.pendNew+gross>e.c+1){msg.textContent=`مرفوضة: السلفة تتجاوز المتبقي من العقد (${fmt(e.c-e.sp-e.pendNew)} د.ع). سجّل أمر غيار أولاً إن كان هناك زيادة معتمدة.`;return}
  const no=Math.max(1,parseInt(val("a_no"))||1),fin=$("#a_final").checked;
  if(e.advs.some(a=>a.stage!=="rejected"&&(fin?a.final:(!a.final&&a.no===no)))){msg.textContent=fin?"توجد سلفة نهائية مسجلة لهذا المشروع.":`السلفة رقم ${no} مسجلة سابقاً لهذا المشروع.`;return}
  const by=await me(),at=new Date().toISOString();
  const doc={pid:e.id,no,final:fin,gross,ret:ded[0],tax:ded[1],fine:ded[2],oth:ded[3],date:val("a_date")||today(),ref:val("a_ref"),note:val("a_note"),stage:"raised",by,at,hist:[{s:"raised",by,at,note:val("a_note"),ref:val("a_ref")}]};
  $("#a_save").disabled=true;msg.className="fmsg";msg.textContent="جارٍ الحفظ…";
  try{await DB.collection("advances").add(doc);logA("رفع سلفة جديدة",{pid:e.id,amt:gross,d:advLabel(doc)+(doc.ref?" · كتاب "+doc.ref:"")});S.advForm=false;S.dirty=false;toast("رُفعت السلفة "+advLabel(doc)+" وهي بانتظار التدقيق")}
  catch(err){$("#a_save").disabled=false;failMsg(msg,err)}}

async function saveTx(ev){ev.preventDefault();const e=EM[S.dr.id];const msg=$("#t_msg");msg.className="fmsg err";
  const type=$("#t_type").value,amt=money("t_amt");
  if((type==="pay"||type==="change")&&(!amt||isNaN(amt))){msg.textContent="أدخل المبلغ. للتصحيح استخدم مبلغاً سالباً.";return}
  if(type==="status"&&!val("t_st")){msg.textContent="اكتب الحالة الجديدة أو اخترها.";return}
  if(type==="note"&&!val("t_note")){msg.textContent="اكتب نص الملاحظة.";return}
  if(type==="pay"&&e.c&&e.sp+amt>e.c+1){msg.textContent=`مرفوض: الصرف يتجاوز مبلغ العقد (المتبقي ${fmt(e.c-e.sp)} د.ع).`;return}
  let ck=null;if(type==="change"&&amt>0){ck=allocCheck(e.pl,yearOf(val("t_date"))||CUR_YEAR,amt);if(ck&&ck.block){msg.textContent=ck.msg;return}}
  const doc={overAlloc:!!ck,pid:e.id,type,amt:(type==="status"||type==="note")?0:amt,date:val("t_date")||today(),ref:val("t_ref"),note:val("t_note"),at:new Date().toISOString(),by:await me()};
  if(type==="status")doc.newSt=val("t_st");
  $("#t_save").disabled=true;msg.className="fmsg";msg.textContent="جارٍ الحفظ…";
  try{await DB.collection("txns").add(doc);logA(TYPES[type]+(type==="status"?": "+doc.newSt:""),{pid:e.id,amt:doc.amt,d:[doc.ref,doc.note,doc.overAlloc?"تجاوز التخصيص":""].filter(Boolean).join(" · ")});S.dirty=false;toast("حُفظت الحركة في سجل المشروع")}
  catch(err){$("#t_save").disabled=false;failMsg(msg,err)}}

async function saveEdit(ev){ev.preventDefault();const e=EM[S.dr.id];const msg=$("#ed_msg");msg.className="fmsg err";
  const changes={};
  for(const [f,d] of Object.entries(EDITABLE)){let v;
    if(d.money){v=money("ed_"+f);if(isNaN(v)){msg.textContent=`قيمة غير صالحة في «${d.l}».`;return}}
    else if(d.num)v=Math.round(+val("ed_"+f)||0);else v=val("ed_"+f);
    let cur=f==="bank"?e.bankBase:e[f];if(d.num)cur=+cur||0;else cur=cur==null?"":String(cur);if(f==="st"&&cur==="غير محددة")cur="";
    if(String(v)!==String(cur))changes[f]={from:cur,to:v}}
  if(!Object.keys(changes).length){msg.textContent="لم تغيّر أي حقل.";return}
  if(changes.nm&&!changes.nm.to){msg.textContent="اسم المشروع لا يكون فارغاً.";return}
  if(!val("ed_why")){msg.textContent="اكتب سبب التعديل، فهو جزء من سجل التدقيق.";$("#ed_why").focus();return}
  let ck=null;if(changes.c&&changes.c.to>changes.c.from){ck=allocCheck(changes.pl?changes.pl.to||e.pl:e.pl,CUR_YEAR,changes.c.to-changes.c.from);if(ck&&ck.block){msg.textContent=ck.msg;return}}
  const doc={overAlloc:!!ck,pid:e.id,type:"edit",changes,amt:0,date:today(),note:val("ed_why"),at:new Date().toISOString(),by:await me()};

recompute();render();
(async()=>{
  const sync=$("#sync");
  if(!window.claude||!claude.use){DB=false;sync.textContent="عرض فقط";render();return}
  const timer=setTimeout(()=>{if(DB===null){DB=false;sync.textContent="الحفظ المشترك غير متاح";render()}},10000);
  claude.use("downloads").then(d=>{DL=d;render()}).catch(()=>{});
  claude.use("user").then(async u=>{USER=u;if(u){try{UID=await u.id()}catch(_){}try{CANW=await u.can("data.write")}catch(_){}render();if(S.dr&&!S.dirty)renderDrawer()}}).catch(()=>{});
  const db=await claude.use("db").catch(()=>null);
  if(!db){clearTimeout(timer);DB=false;sync.textContent="الحفظ المشترك غير متاح";render();return}
  const got={txns:false,advances:false,projects:false,allocs:false,guarantees:false,loans:false,log:false,oplines:false,opexp:false,emps:false,jvs:false,imports:false};
  const resolveNames=async()=>{const ids=[...new Set([...TX.map(t=>t.by),...NP.map(p=>p.by),...ADV.flatMap(a=>(a.hist||[]).map(h=>h.by)),...AL.map(a=>a.by),...GU.flatMap(g=>(g.hist||[]).map(h=>h.by)),...(SET.hist||[]).map(h=>h.by),...LO.map(l=>l.by),...LOG.map(l=>l.by)].filter(x=>x&&!NAMES[x]))];
    if(USER&&ids.length&&USER.profiles){try{const ps=await USER.profiles(ids.slice(0,64));for(const i of ids)NAMES[i]=(ps[i]&&ps[i].name)||"مستخدم";if(cur()==="journal")vJournal()}catch(_){}}};
  const onData=()=>{clearTimeout(timer);DB=db;const ok=Object.values(got).every(Boolean);
    sync.textContent=ok?`متصل · ${fmt(ADV.length)} سلفة · ${fmt(GU.length)} ضمان`:"جارٍ التحميل…";sync.classList.toggle("on",ok);clearTimeout(S.rt);S.rt=setTimeout(()=>{refreshAll();resolveNames()},120)};
  const fail=()=>{clearTimeout(timer);DB=false;sync.textContent="تعذّر الاتصال بقاعدة البيانات";render()};
  db.collection("txns").orderBy("at","desc").limit(1000).onSnapshot(s=>{TX=s.docs.map(d=>({_id:d.id,...d.data()})).filter(t=>t&&t.pid);got.txns=true;onData()},fail);
  db.collection("advances").orderBy("at","desc").limit(1000).onSnapshot(s=>{ADV=s.docs.map(d=>({_id:d.id,...d.data()})).filter(a=>a&&a.pid);got.advances=true;onData()},fail);
  const L1=(c,k,f)=>db.collection(c).orderBy("at","desc").limit(1000).onSnapshot(s=>{f(s.docs.map(d=>({_id:d.id,...d.data()})));got[k]=true;onData()},fail);
  L1("oplines","oplines",a=>{OPL=a.filter(l=>l&&l.code)});
  L1("opexp","opexp",a=>{OPX=a.filter(v=>v&&v.code)});
  L1("jvs","jvs",a=>{JVS=a.filter(j=>j&&j.lines)});
  L1("imports","imports",a=>{IMPB=a});
  db.collection("emps").orderBy("i","asc").limit(1000).onSnapshot(s=>{EMPC=s.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>(+a.i)-(+b.i));EMP=EMPC.flatMap(c=>c.rows||[]);got.emps=true;onData()},fail);
  db.collection("settings").doc("coa").onSnapshot(s=>{const d=(s.exists&&s.data())||{};COA={map:d.map||{},custom:d.custom||[]};refreshAll()},()=>{});
  db.collection("loans").orderBy("at","desc").limit(1000).onSnapshot(s=>{LO=s.docs.map(d=>({_id:d.id,...d.data()})).filter(l=>l&&l.pid);got.loans=true;onData()},fail);
  db.collection("log").orderBy("at","desc").limit(1000).onSnapshot(s=>{LOG=s.docs.map(d=>({_id:d.id,...d.data()})).filter(l=>l&&l.act);got.log=true;onData()},fail);
  db.collection("allocs").orderBy("at","desc").limit(1000).onSnapshot(s=>{AL=s.docs.map(d=>({_id:d.id,...d.data()})).filter(a=>a&&a.pl&&a.yr);got.allocs=true;onData()},fail);
  db.collection("guarantees").orderBy("at","desc").limit(1000).onSnapshot(s=>{GU=s.docs.map(d=>({_id:d.id,...d.data()})).filter(g=>g&&g.pid);got.guarantees=true;onData()},fail);
  db.collection("settings").doc("main").onSnapshot(s=>{const d=(s.exists&&s.data())||{};SET={enforce:d.enforce!==false,hist:d.hist||[],pwHash:d.pwHash||""};refreshAll()},()=>{});
  db.collection("projects").orderBy("at","desc").limit(1000).onSnapshot(s=>{NP=s.docs.map(d=>({_id:d.id,...d.data()})).filter(p=>p&&p.nm);got.projects=true;onData()},fail);
})();
